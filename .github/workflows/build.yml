name: Build Kernel

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '**/config*'
      - '**/.config'
      - 'build.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
    strategy:
      matrix:
        target: [x86_64-ubuntu2604]

    steps:
      - name: Cleanup previous root-owned artifacts
        run: |
          docker run --rm -v "$PWD:/workspace" ubuntu:24.04 bash -c "chown -R $(id -u):$(id -g) /workspace 2>/dev/null || true" || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache kernel source and patches
        uses: actions/cache@v4
        with:
          path: |
            ./*.tar.xz
            ./*.patch.xz
          key: kernel-source-${{ matrix.target }}-7.0.1

      - name: Build Kernel inside Ubuntu 24.04 Docker Container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:24.04 bash -c "
              apt-get update && \
              apt-get install -y build-essential bc kmod cpio flex bison \
                libncurses-dev libelf-dev libssl-dev dwarves rsync \
                debhelper libdw-dev zstd wget xz-utils patch git \
                gawk pkg-config python3 ca-certificates && \
              bash ./build.sh ${{ matrix.target }} && \
              chown -R $(id -u):$(id -g) /workspace
            "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-packages-${{ matrix.target }}
          path: ./*.deb

      - name: Create release and upload packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./*.deb
